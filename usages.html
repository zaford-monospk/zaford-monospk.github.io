<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이용약관</title>
    <style>
        body { font-family: -apple-system, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
               max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; line-height: 1.7; color: #222; background: #fff; }
        h1 { font-size: 1.5rem; margin: 0 0 20px; }
        #output { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; font-size: 0.95rem; }
    </style>
</head>
<body>
    <header>
        <h1 id="title">이용약관</h1>
        <div id="output">로딩 중...</div>
    </header>
    <script>
        // ?lang=kr (또는 ko, ko-KR) → 한국어, 그 밖의 값(en, ja, zh ...) → 영어. 파라미터가 없으면 한국어.
        const raw = (new URLSearchParams(location.search).get("lang") || "kr").toLowerCase();
        const lang = (raw === "kr" || raw.startsWith("ko")) ? "kr" : "en";
        const titles = { kr: "이용약관", en: "Terms of Service" };

        document.documentElement.lang = lang === "kr" ? "ko" : "en";
        document.getElementById("title").textContent = titles[lang];
        document.title = titles[lang];
        document.getElementById("output").textContent = lang === "kr" ? "로딩 중..." : "Loading...";

        fetch(`law/termsofservice_${lang}.txt`)
            .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(text => { document.getElementById("output").textContent = text; })
            .catch(err => {
                document.getElementById("output").textContent =
                    (lang === "kr" ? "문서를 불러올 수 없습니다. " : "Could not load the document. ") + err.message;
            });
    </script>
</body>
</html>
